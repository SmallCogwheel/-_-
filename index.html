<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카페인 계산기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="github-btn" href="https://smallcogwheel.github.io/siteList/" target="_blank">
    <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub">
    <span class="tooltip">SmallCogwheel이 만든 다른 사이트가 보고싶으면?</span>
  </a>

  <div class="app">
    <div class="container">
      <h1>카페인 계산기</h1>

      <div class="row">
        <select id="userTypeSelect">
          <option value="adult">성인</option>
          <option value="teen">청소년</option>
          <option value="pregnant">임산부</option>
        </select>
      </div>

      <div class="row">
        <select id="drinkSelect"></select>
        <select id="sizeSelect"></select>
        <input type="number" id="countInput" value="1" min="1" />
      </div>

      <div class="weight-box">
        <input type="number" id="weightInput" value="70" />
        <span class="unit-inside">kg</span>
      </div>

      <div class="result">
        <div id="caffeineText">총 카페인: 0mg</div>
        <div id="limitText">권장량: -</div>
      </div>
    </div>

    <div class="side">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">0 / 400mg</div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
